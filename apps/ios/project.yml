name: KledningsApp
options:
  bundleIdPrefix: no.kledningsapp
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_TESTABILITY: YES

targets:

  # ── iPhone app ───────────────────────────────────────────
  KledningsApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KledningsApp
      - path: Shared
    resources:
      - KledningsApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kledningsapp.app
        INFOPLIST_FILE: KledningsApp/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: KledningsApp/Info.plist
      properties:
        CFBundleDisplayName: Kle deg
        NSLocationWhenInUseUsageDescription: "Brukes til å hente lokalt vær for kledningsanbefalingen"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # Dev only — remove for production
    dependencies:
      - target: KledningsWidget
      - target: KledningsWatch

  # ── WidgetKit extension ───────────────────────────────────
  KledningsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KledningsWidget
      - path: Shared
    resources:
      - KledningsWidget/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kledningsapp.app.widget
        INFOPLIST_FILE: KledningsWidget/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: KledningsWidget/Info.plist
      properties:
        CFBundleDisplayName: KledningsWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ── Apple Watch app ──────────────────────────────────────
  KledningsWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: KledningsWatch
      - path: Shared
    resources:
      - KledningsWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kledningsapp.app.watchkitapp
        INFOPLIST_FILE: KledningsWatch/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: KledningsWatch/Info.plist
      properties:
        CFBundleDisplayName: Kle deg
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # Dev only
